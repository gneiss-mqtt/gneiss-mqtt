[package]
name = "gneiss-mqtt"
license = "Apache-2.0"
version = "0.5.0"
edition = "2021"
keywords = ["mqtt", "mqtt5", "iot", "aws", "iotcore"]
categories = [ "asynchronous", "network-programming", "web-programming::websocket"]
description = "Asynchronous and threaded MQTT(5) clients"
homepage = "https://github.com/gneiss-mqtt/gneiss-mqtt"
documentation = "https://docs.rs/gneiss-mqtt"
repository = "https://github.com/gneiss-mqtt/gneiss-mqtt"
readme = "README.md"
resolver = "2"

[package.metadata.docs.rs]
features = ["tokio", "threaded"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
strict = [] # treats warnings as errors, only intended for internal checks
testing = [ "dep:assert_matches", "dep:uuid", "dep:test-case" ] # enables environmentally-controlled integration tests and long-running tests (30+ seconds) that check reconnect, backoff, etc...
tokio = ["dep:tokio"] # enables the tokio-based async client
threaded = [] # enables the thread-based sync client; does not add any dependencies

[dev-dependencies]
gneiss-mqtt = { path = ".", features = [ "testing" ]}

[dependencies]
assert_matches = { version = "1.5.0", optional = true } # only included in test builds
lru = { version = "0.12" } # lru topic aliasing cache
log = { version = "0.4" } # logging interface
rand = { version = "0.8" } # reconnect with randomized exponential backoff
test-case = { version = "3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = [ "v4", "fast-rng" ], optional = true } # only included in test builds




