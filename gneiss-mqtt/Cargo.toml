[package]
name = "gneiss-mqtt"
license = "Apache-2.0"
version = "0.5.0"
edition = "2021"
keywords = ["mqtt", "mqtt5", "iot"]
categories = [ "asynchronous", "network-programming" ]
description = "Asynchronous and threaded MQTT(5) clients"
homepage = "https://github.com/gneiss-mqtt/gneiss-mqtt"
documentation = "https://docs.rs/gneiss-mqtt"
repository = "https://github.com/gneiss-mqtt/gneiss-mqtt"
readme = "README.md"
resolver = "2"

[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
strict = [] # treats warnings as errors, only intended for internal checks
testing = [ "dep:assert_matches", "dep:test-case" ] 

[dev-dependencies]
gneiss-mqtt = { path = ".", features = [ "testing" ]}

[dependencies]
log = { version = "0.4" } # logging interface
lru = { version = "0.18" } # lru topic aliasing cache
rand = { version = "0.10" }
assert_matches = { version = "1", optional = true } # only included in test builds
test-case = { version = "3", optional = true }




