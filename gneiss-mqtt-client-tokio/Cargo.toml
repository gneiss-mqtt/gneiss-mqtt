[package]
name = "gneiss-mqtt-client-tokio"
license = "Apache-2.0"
version = "0.1.0"
edition = "2021"
keywords = ["mqtt", "mqtt5", "iot"]
categories = [ "asynchronous", "network-programming" ]
description = "Asynchronous tokio-based MQTT client"
homepage = "https://github.com/gneiss-mqtt/gneiss-mqtt-client-tokio"
documentation = "https://docs.rs/gneiss-mqtt-client-tokio"
repository = "https://github.com/gneiss-mqtt/gneiss-mqtt-client-tokio"
readme = "README.md"
resolver = "2"

[features]
strict = [] # treats warnings as errors, only intended for internal checks
testing = [ "dep:assert_matches", "dep:test-case", "gneiss-mqtt/testing", "gneiss-mqtt-client-async/testing" ]

[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gneiss-mqtt = { path = "../gneiss-mqtt" }
gneiss-mqtt-client-async = { path = "../gneiss-mqtt-client-async" }
assert_matches = { version = "1", optional = true } # only included in test builds
test-case = { version = "3", optional = true }

[dev-dependencies]
gneiss-mqtt-client-tokio = { path = ".", features = [ "testing" ]}
